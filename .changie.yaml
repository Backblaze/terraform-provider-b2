changesDir: .changes
unreleasedDir: unreleased
headerPath: header.tpl.md
changelogPath: CHANGELOG.md
versionExt: md
versionFormat: '## [{{.VersionNoPrefix}}] - {{.Time.Format "2006-01-02"}}'
kindFormat: '### {{.Kind}}'
changeFormat: '* {{.Body}}'
footerFormat: |-
  [{{.VersionNoPrefix}}]: https://github.com/Backblaze/terraform-provider-b2/compare/{{.PreviousVersion}}...{{.Version}}
# Pre-1.0, breaking changes bump the minor; v1.0.0 is always an explicit `changie batch v1.0.0`.
kinds:
  - label: Added
    auto: minor
  - label: Changed
    auto: minor
  - label: Deprecated
    auto: minor
  - label: Removed
    auto: minor
  - label: Fixed
    auto: patch
  - label: Security
    auto: patch
  - label: Infrastructure
    auto: patch
newlines:
  afterChangelogHeader: 0
  beforeChangelogVersion: 1
  endOfVersion: 1
  afterKind: 0
  beforeKind: 1
  beforeFooterTemplate: 1
envPrefix: CHANGIE_

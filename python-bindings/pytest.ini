[pytest]
testpaths = tests
addopts = -p pytester
markers =
    known_defect(raises, match, reason=''): the test describes the correct behaviour of a defect that is still present. It is a strict expected failure only when it fails with an exception of type `raises` whose message matches the regex `match`; any other failure (fixture errors included) fails normally, an unexpected pass fails, and --runxfail shows the original failure

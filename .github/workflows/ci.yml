name: Continuous Integration

on:
  push:
    branches: [master, release/*]
    paths-ignore:
      - '.github/no-response.yml'
      - '.github/workflows/cd.yml'
      - 'LICENSE'
      - 'README.md'
      - 'README.release.md'
  pull_request:
    branches: [master, release/*]

defaults:
  run:
    shell: bash

env:
  PYTHON_DEFAULT_VERSION: '3.13'
  GO_DEFAULT_VERSION: '1.26.10'

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Set up Python ${{ env.PYTHON_DEFAULT_VERSION }}
        uses: deadsnakes/action@e640ac8743173a67cca4d7d77cd837e514bf98e8 # v3.2.0
        with:
          python-version: ${{ env.PYTHON_DEFAULT_VERSION }}
      - name: Set up Go ${{ env.GO_DEFAULT_VERSION }}
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_DEFAULT_VERSION }}
      - name: Install dependencies
        run: |
          make deps
      - name: Run dependency checker
        run: |
          make deps-check
      - name: Run linters
        run: |
          make lint
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_wrapper: false
      - name: Run docs linters
        run: |
          make docs-lint
      - name: Validate changelog
        # Library was designed to be used with pull requests only.
        if: ${{ github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' }}
        uses: zattoo/changelog@0525217de980f73281de086cb7a6930c230b7ab8 # 2.0.0
        with:
          token: ${{ github.token }}
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Set up Go ${{ env.GO_DEFAULT_VERSION }}
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_DEFAULT_VERSION }}
      - name: Run unit tests
        run: make test
  build:
    needs: [lint, test]
    runs-on: ${{ matrix.conf.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        conf:
          - { runner: ubuntu-latest, os: linux, arch: amd64 }
          - { runner: macos-14-large, os: darwin, arch: amd64 }
          - { runner: macos-14, os: darwin, arch: arm64 }
          - { runner: windows-2022, os: windows, arch: amd64 }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Set up Python ${{ env.PYTHON_DEFAULT_VERSION }} (ubuntu-latest)
        if: matrix.conf.os == 'linux'
        uses: deadsnakes/action@e640ac8743173a67cca4d7d77cd837e514bf98e8 # v3.2.0
        with:
          python-version: ${{ env.PYTHON_DEFAULT_VERSION }}
      - name: Set up Python ${{ env.PYTHON_DEFAULT_VERSION }}
        if: matrix.conf.os != 'linux'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_DEFAULT_VERSION }}
      - name: Set up Go ${{ env.GO_DEFAULT_VERSION }}
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_DEFAULT_VERSION }}
      - name: Install dependencies
        run: |
          make deps
      - name: Build the provider
        run: |
          make build
      - name: Upload python bindings
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: py-terraform-provider-b2-${{ matrix.conf.os }}-${{ matrix.conf.arch }}
          path: python-bindings/dist/py-terraform-provider-b2
          if-no-files-found: error
          retention-days: 1
  testacc:
    needs: build
    env:
      B2_TEST_APPLICATION_KEY: ${{ secrets.B2_TEST_APPLICATION_KEY }}
      B2_TEST_APPLICATION_KEY_ID: ${{ secrets.B2_TEST_APPLICATION_KEY_ID }}
      NOPYBINDINGS: 1  # do not build python buildings
    runs-on: ${{ matrix.conf.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        conf:
          - { runner: ubuntu-latest, os: linux, arch: amd64, terraform: '1.14.*' }
          - { runner: ubuntu-latest, os: linux, arch: amd64, terraform: '1.13.*'  }
          # for macOS, the latest terraform is enough for ACC tests
          - { runner: macos-14-large, os: darwin, arch: amd64, terraform: '1.14.*' }
          - { runner: macos-14, os: darwin, arch: arm64, terraform: '1.14.*' }
          # for Windows, the latest terraform is enough for ACC tests
          - { runner: windows-2022, os: windows, arch: amd64, terraform: '1.14.*' }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Set up Go ${{ env.GO_DEFAULT_VERSION }}
        if: ${{ env.B2_TEST_APPLICATION_KEY != '' && env.B2_TEST_APPLICATION_KEY_ID != '' }}
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_DEFAULT_VERSION }}
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        name: Set up Terraform ${{ matrix.conf.terraform }}
        with:
          terraform_version: ${{ matrix.conf.terraform }}
          terraform_wrapper: false
      - name: Download python bindings for given OS
        if: ${{ env.B2_TEST_APPLICATION_KEY != '' && env.B2_TEST_APPLICATION_KEY_ID != '' }}
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: py-terraform-provider-b2-${{ matrix.conf.os }}-${{ matrix.conf.arch }}
          path: python-bindings/dist/
      - name: Run acceptance tests with Intel-Mac DNS retry
        if: ${{ env.B2_TEST_APPLICATION_KEY != '' && env.B2_TEST_APPLICATION_KEY_ID != '' && matrix.conf.os == 'darwin' && matrix.conf.arch == 'amd64' }}
        timeout-minutes: 120
        run: |
          max_attempts=3
          for attempt in $(seq 1 "$max_attempts"); do
            set +e
            make testacc 2>&1 | tee testacc.log
            status=${PIPESTATUS[0]}
            set -e

            if [ "$status" -eq 0 ]; then
              exit 0
            fi

            if ! grep -Eqi 'UnknownHost|NameResolutionError|[Gg]etaddrinfo|nodename nor servname' testacc.log; then
              exit "$status"
            fi

            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "::error::Acceptance tests still hit a DNS-resolution error after ${max_attempts} attempts."
              exit "$status"
            fi

            delay=$((attempt * 15))
            echo "Transient DNS-resolution failure; retrying in ${delay}s (attempt $((attempt + 1))/${max_attempts})."
            sleep "$delay"
          done
      - name: Run acceptance tests
        if: ${{ env.B2_TEST_APPLICATION_KEY != '' && env.B2_TEST_APPLICATION_KEY_ID != '' && !(matrix.conf.os == 'darwin' && matrix.conf.arch == 'amd64') }}
        timeout-minutes: 120
        run: |
          make testacc

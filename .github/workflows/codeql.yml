name: CodeQL

on:
  push:
    branches: [master, release/*]
    paths-ignore:
      - '.github/no-response.yml'
      - '.github/workflows/cd.yml'
      - 'LICENSE'
      - 'README.md'
      - 'README.release.md'
  pull_request:
    branches: [master, release/*]
  schedule:
    - cron: '41 5 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL analyze (${{ matrix.language }})
    if: ${{ github.actor != 'dependabot[bot]' && github.event.pull_request.user.login != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { language: go, build-mode: manual }
          - { language: python, build-mode: none }
          - { language: actions, build-mode: none }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Initialize CodeQL
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality  # quality findings also hold a release (RELEASE.md)
      - name: Build the provider without python bindings
        if: matrix.language == 'go'
        run: |
          touch b2/py-terraform-provider-b2  # required by go:embed in bindings.go
          go build ./...
      # Uploads also work for fork PRs: code scanning accepts pull_request results with a read-only token.
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: /language:${{ matrix.language }}

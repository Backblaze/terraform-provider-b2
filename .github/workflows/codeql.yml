name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
    branches: [master, release/*]
  schedule:
    - cron: '24 5 * * 1'

permissions:
  contents: read

env:
  GO_DEFAULT_VERSION: '1.26.10'

jobs:
  analyze:
    name: CodeQL analyze (${{ matrix.language }})
    if: ${{ github.actor != 'dependabot[bot]' && github.event.pull_request.user.login != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { language: go, build-mode: manual }
          - { language: python, build-mode: none }
          - { language: actions, build-mode: none }
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Set up Go ${{ env.GO_DEFAULT_VERSION }}
        if: matrix.language == 'go'
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_DEFAULT_VERSION }}
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality  # quality findings also hold a release (RELEASE.md)
      - name: Build the provider without python bindings
        if: matrix.language == 'go'
        run: |
          touch b2/py-terraform-provider-b2  # required by go:embed in bindings.go
          go build ./...
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

name: CodeQL

on:
  push:
    branches: [master, release/*]
    paths-ignore:
      - 'LICENSE'
      - 'README.md'
      - 'README.release.md'
  pull_request:
    branches: [master, release/*]
  schedule:
    - cron: '41 5 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Initialize CodeQL
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          languages: go
          build-mode: manual
      - name: Build
        run: |
          touch b2/py-terraform-provider-b2  # required by go:embed in bindings.go
          go build ./...
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          category: /language:go

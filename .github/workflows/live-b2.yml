name: Weekly Live B2 Acceptance

on:
  schedule:
    - cron: "15 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Live runs share one B2 account; never run two at once.
concurrency:
  group: live-b2
  cancel-in-progress: false

env:
  PYTHON_DEFAULT_VERSION: "3.13"
  TERRAFORM_VERSION: "1.14.*"
  GO_DEFAULT_VERSION: "1.26.11"

jobs:
  live-b2-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Require live B2 credentials
        env:
          B2_TEST_APPLICATION_KEY: ${{ secrets.B2_TEST_APPLICATION_KEY }}
          B2_TEST_APPLICATION_KEY_ID: ${{ secrets.B2_TEST_APPLICATION_KEY_ID }}
        run: |
          if [ -z "$B2_TEST_APPLICATION_KEY" ] || [ -z "$B2_TEST_APPLICATION_KEY_ID" ]; then
            echo "B2_TEST_APPLICATION_KEY and B2_TEST_APPLICATION_KEY_ID are required."
            exit 1
          fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Python ${{ env.PYTHON_DEFAULT_VERSION }}
        uses: deadsnakes/action@e640ac8743173a67cca4d7d77cd837e514bf98e8  # v3.2.0; staticx doesn't work with python installed by setup-python action
        with:
          python-version: ${{ env.PYTHON_DEFAULT_VERSION }}
      - name: Set up Go ${{ env.GO_DEFAULT_VERSION }}
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_DEFAULT_VERSION }}
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        name: Set up Terraform ${{ env.TERRAFORM_VERSION }}
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: Install dependencies
        run: make deps
      - name: Test against live B2
        env:
          B2_TEST_APPLICATION_KEY: ${{ secrets.B2_TEST_APPLICATION_KEY }}
          B2_TEST_APPLICATION_KEY_ID: ${{ secrets.B2_TEST_APPLICATION_KEY_ID }}
        run: make testacc
  # A scheduled failure opens an issue, or comments on the open one, so it does not go unnoticed.
  report-scheduled-failure:
    needs: [live-b2-acceptance]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the live B2 failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Weekly live B2 acceptance tests failed"
          body="The scheduled live B2 acceptance run failed: $RUN_URL"
          issue="$(gh issue list --state open --search "\"$title\" in:title" --json number,title \
            --jq "map(select(.title == \"$title\")) | .[0].number // empty")"
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

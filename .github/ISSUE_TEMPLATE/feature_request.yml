name: Feature request
description: A B2 capability, resource, data source or argument the provider should support.
labels: [enhancement]
type: Feature
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can you not manage with Terraform today, and who is affected?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Proposed outcome
      description: The resource, data source or argument you want, with an example configuration. Link the B2 API docs for the calls involved if you know them.
      render: hcl
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints and alternatives
      description: Capabilities the key needs, behavior of the b2 CLI or b2-sdk-python, import and state compatibility, workarounds.
